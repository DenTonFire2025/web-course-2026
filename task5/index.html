<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simon — лабораторная работа №5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1 class="title">Simon</h1>

    <div class="board is-locked" id="board" role="group" aria-label="Игровое поле">
      <button type="button" class="pad pad-0" data-pad="0" aria-label="Красный сектор"></button>
      <button type="button" class="pad pad-1" data-pad="1" aria-label="Жёлтый сектор"></button>
      <button type="button" class="pad pad-2" data-pad="2" aria-label="Бирюзовый сектор"></button>
      <button type="button" class="pad pad-3" data-pad="3" aria-label="Синий сектор"></button>

      <div class="hub" id="hub">
        <span class="hub-label">уровень</span>
        <output class="hub-level" id="level">0</output>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">Нажмите «Старт», чтобы начать</p>

    <div class="controls">
      <button type="button" class="start-btn" id="start">Старт</button>
      <label class="sound">
        <input type="checkbox" id="sound" checked>
        Звук
      </label>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
